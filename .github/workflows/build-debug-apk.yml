name: Build Debug APK

on:
  push:
    branches:
      - feat/tts-speed-control
      - feat/tts-natural-voice-and-kokoro
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Accept Licenses and Install Android Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13599879"
          
          # Fix NDK version name mismatch (29.0.13599879 vs 29.0.13599879 rc2)
          if [ -d "$ANDROID_HOME/ndk/29.0.13599879" ]; then
            rm -rf "$ANDROID_HOME/ndk/29.0.13599879 rc2" || true
            cp -r "$ANDROID_HOME/ndk/29.0.13599879" "$ANDROID_HOME/ndk/29.0.13599879 rc2"
            if [ -f "$ANDROID_HOME/ndk/29.0.13599879 rc2/source.properties" ]; then
              sed -i 's/Pkg.Revision = .*/Pkg.Revision = 29.0.13599879 rc2/' "$ANDROID_HOME/ndk/29.0.13599879 rc2/source.properties"
            fi
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13599879 rc2" >> $GITHUB_ENV

      - name: Generate mock key.properties and google-services.json
        run: |
          touch key.properties
          mkdir -p app/src/debug
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "mock-handy-reader",
              "storage_bucket": "mock-handy-reader.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.wxn.reader"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fakeApiKeyForDebugBuild1234567890"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.wxn.reader.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fakeApiKeyForDebugBuild1234567890"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/google-services.json

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch SheenBidi Native Dependency
        run: |
          if [ ! -d "bookread/src/main/cpp/SheenBidi" ]; then
            git clone --depth 1 --branch v3.0.0 https://github.com/Tehreer/SheenBidi.git bookread/src/main/cpp/SheenBidi
          fi

      - name: Build Debug APK
        id: build_apk
        run: |
          set -o pipefail
          ./gradlew assembleDebug -x lint -x test --stacktrace 2>&1 | tee gradle_build.log

      - name: Prepare Kokoro Model Zip Asset
        run: |
          curl -L -o kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2
          python -c "
          import tarfile, zipfile
          with tarfile.open('kokoro.tar.bz2', 'r:bz2') as tar:
              with zipfile.ZipFile('kokoro-int8-multi-lang-v1_1.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
                  for m in tar.getmembers():
                      if m.isfile():
                          z.writestr(m.name, tar.extractfile(m).read())
          "
          rm -f kokoro.tar.bz2

      - name: Prepare Build Summary
        if: always()
        run: |
          echo "### 📱 HandyReader 调试版构建产物 (自然语音 + 倍速优化版)" > build_summary.md
          echo "- **分支**：\`${{ github.ref_name }}\`" >> build_summary.md
          echo "- **核心升级项**：" >> build_summary.md
          echo "  - **句末韵律标点完整保留**：彻底修复合成前剥离句末标点导致断句急刹车、问句语调丢失的问题" >> build_summary.md
          echo "  - **长句分句上限扩充至80字**：保证中文长句呼吸连贯，杜绝逗号处把句子撕裂成孤立音频片段" >> build_summary.md
          echo "  - **Kokoro-82M INT8 离线模型深度集成**：StyleTTS2 神经架构，含55位国语女声/45位国语男声，内置Jieba词性分词" >> build_summary.md
          echo "  - **0.8x-1.2x快捷倍速与0.01微调**：平滑调节与DataStore即时持久化" >> build_summary.md
          echo "" >> build_summary.md
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "✅ **Debug APK 构建成功！**" >> build_summary.md
            echo "#### 生成的文件：" >> build_summary.md
            ls -lh app/build/outputs/apk/debug/*.apk >> build_summary.md
            if [ -f "kokoro-int8-multi-lang-v1_1.zip" ]; then
              ls -lh kokoro-int8-multi-lang-v1_1.zip >> build_summary.md
            fi
          else
            echo "❌ **Debug APK 构建失败！**" >> build_summary.md
            echo "#### gradle_build.log 尾部 80 行：" >> build_summary.md
            echo '```text' >> build_summary.md
            tail -n 80 gradle_build.log >> build_summary.md
            echo '```' >> build_summary.md
          fi

      - name: Upload APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HandyReader-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            kokoro-int8-multi-lang-v1_1.zip
            gradle_build.log

      - name: Create or Update GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v-debug-test
          name: "HandyReader 测试版 APK (自然语音与倍速优化版)"
          body_path: build_summary.md
          files: |
            app/build/outputs/apk/debug/*.apk
            kokoro-int8-multi-lang-v1_1.zip
            gradle_build.log
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
